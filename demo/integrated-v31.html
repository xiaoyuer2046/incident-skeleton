<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incident Skeleton v3.1 · Integrated Skeleton</title>
<script src="theme.js"></script>
<style>
:root{--ink:#0b0812;--panel:#161022;--panel2:#1d1530;--line:rgba(190,170,255,.14);--line2:rgba(190,170,255,.28);--text:#eee9df;--muted:#a79dbb;--dim:#8a81a0;--ember:#ff7a1a;--violet:#8b5cf6;--ghost:#4ee6a0;--blood:#ff4d64;--amber:#ffc24a;--sky:#6cb6ff;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
html[data-theme=day]{color-scheme:light;--ink:#f5f3f8;--panel:#fff;--panel2:#f7f5fa;--line:rgba(55,36,92,.12);--line2:rgba(55,36,92,.28);--text:#211c2c;--muted:#5a5269;--dim:#7a7289;--ember:#c04c00;--violet:#6941d9;--ghost:#137f50;--blood:#ca2941;--amber:#8a5700;--sky:#1d68bf}
html[data-theme=night]{color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(900px 460px at 80% -8%,rgba(139,92,246,.18),transparent 62%),var(--ink);color:var(--text);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit}
a{color:var(--sky)}
.skip{position:fixed;left:12px;top:-60px;z-index:100;padding:8px 12px;background:var(--panel);color:var(--text);border:2px solid var(--violet);border-radius:8px}.skip:focus{top:12px}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--violet);outline-offset:3px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px clamp(16px,3vw,34px);background:color-mix(in srgb,var(--ink) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{font:600 18px ui-serif,Georgia,serif;white-space:nowrap}.brand em{font-style:italic;color:var(--ember)}.brand small{display:block;font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid var(--amber);border-radius:999px;color:var(--amber);font:700 11px var(--mono);letter-spacing:.06em}.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.ctrl{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden}.seg button{border:0;background:transparent;padding:6px 11px;cursor:pointer;font:600 12px var(--mono);color:var(--muted)}.seg button[aria-pressed=true]{background:rgba(255,122,26,.16);color:var(--ember)}.seg button:hover{color:var(--text)}
.shell{width:min(1360px,100%);margin:auto;padding:clamp(16px,3vw,32px)}
.banner{margin-bottom:14px;padding:9px 14px;border:1px dashed var(--amber);border-radius:12px;color:var(--amber);font-size:12.5px}
.eyebrow{font:650 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hero{border:1px solid var(--line);border-left:5px solid var(--violet);border-radius:20px;background:var(--panel);padding:22px clamp(16px,2.4vw,28px);margin-bottom:16px}
.hero h1{margin:6px 0 10px;font:650 clamp(22px,3.4vw,38px)/1.2 ui-serif,Georgia,"Songti SC",serif}
.hero .lead{margin:0 0 14px;color:var(--muted);max-width:880px}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:6px}
.stat{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font:750 22px var(--mono)}
.spine{margin:18px 0 6px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;list-style:none;padding:0}
.sp{position:relative;padding:12px 10px 10px;border:1px solid var(--line2);border-radius:14px;background:var(--panel2);text-align:center;min-width:0}
.sp:not(:last-child)::after{content:"→";position:absolute;right:-11px;top:50%;transform:translateY(-50%);color:var(--muted);z-index:2}
.sp b{display:block;font-size:14px}.sp small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.sp.v3{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet) inset}.sp.v2{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember) inset}
.tag{display:inline-flex;margin-top:6px;padding:1px 8px;border-radius:999px;font:700 11px var(--mono);border:1px solid currentColor}
.tag.v3{color:var(--violet)}.tag.v2{color:var(--ember)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:8px 0 0;color:var(--muted);font-size:12.5px}
.legend .tag{margin:0 6px 0 0}
.callouts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 16px}
.call{padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
.call h2{margin:0 0 6px;font-size:14px}.call p{margin:4px 0;color:var(--muted);font-size:13px}
.call.teams{border-color:var(--sky)}.call.safe{border-color:var(--ghost)}
.call ul{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:13px}
.lane{border:1px solid var(--line);border-radius:18px;background:var(--panel);margin-bottom:16px;overflow:hidden}
.lane>h2{margin:0;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:15px}
.lane>h2 .meta{margin-left:auto;font:500 11px var(--mono);color:var(--muted)}
.items{padding:12px 14px;display:grid;gap:12px}
.item{border:1px solid var(--line);border-radius:14px;background:var(--panel2);padding:12px 14px;min-width:0}
.item:focus{border-color:var(--violet)}
.item header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.item h3{margin:0;font-size:14px;flex:1 1 220px;overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;padding:2px 9px;border:1px solid var(--line2);border-radius:999px;font:650 11.5px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;white-space:nowrap}
.c-ok{color:var(--ghost);border-color:var(--ghost)}.c-bad{color:var(--blood);border-color:var(--blood)}.c-warn{color:var(--amber);border-color:var(--amber)}.c-info{color:var(--sky);border-color:var(--sky)}
.parent{font-size:12.5px;color:var(--muted);margin:0 0 8px;overflow-wrap:anywhere}
.six{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;list-style:none;margin:0;padding:0}
.six li{padding:8px 9px;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-width:0}
.six li b{display:block;font-size:12px}.six li span{display:block;margin-top:3px;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.six li.v3{border-color:var(--violet);background:color-mix(in srgb,var(--violet) 14%,var(--panel))}
.six li.v2{border-color:var(--ember);background:color-mix(in srgb,var(--ember) 14%,var(--panel))}
.six li .tag{display:inline-flex;margin:0 0 3px;font-size:10.5px}
.six li.v3>span:last-child,.six li.v2>span:last-child{color:var(--text)}
.held{margin:8px 0 0;font-size:12.5px;color:var(--amber)}
.closure{padding:8px 10px;border:1px solid var(--ghost);border-radius:10px;font-size:12.5px}
.empty{padding:26px 18px;text-align:center;border:1px dashed var(--line2);border-radius:12px;color:var(--muted)}.empty b{display:block;margin-bottom:4px;color:var(--text)}
.links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.links a{display:block;padding:12px 14px;border:1px solid var(--line2);border-radius:14px;background:var(--panel);text-decoration:none;color:var(--text)}.links a:hover{border-color:var(--violet)}.links a b{display:block}.links a span{color:var(--muted);font-size:12.5px}
.foot{margin-top:16px;padding:12px 2px;color:var(--dim);font-size:12px}.foot strong{color:var(--amber)}
@media(max-width:1100px){.six{grid-template-columns:repeat(3,minmax(0,1fr))}.spine{grid-template-columns:repeat(3,minmax(0,1fr))}.sp:nth-child(3)::after{display:none}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){.top{position:relative}.ctrl{width:100%;margin-left:0}.callouts,.links{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.six{grid-template-columns:1fr 1fr}}
@media(max-width:460px){.six,.spine{grid-template-columns:1fr}.sp::after{display:none!important}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

var lang='zh';
try{var sl=localStorage.getItem('lang');if(sl==='en'||sl==='zh')lang=sl;else if((navigator.language||'').toLowerCase().indexOf('zh')!==0)lang='en';}catch(e){}
var SK=['RECEIVE','TRIAGE','INVESTIGATE','MITIGATE','RESOLVE','LOG'];
var PLUG={TRIAGE:'v3',MITIGATE:'v2',LOG:'v2'};
function t(k){return (T[lang]&&T[lang][k]!=null)?T[lang][k]:(T.zh[k]||'')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function loc(o){if(o==null)return '';if(typeof o==='string')return o;return o[lang]||o.zh||o.en||''}
function fmt(s,m){return s.replace(/%(\w)/g,function(a,k){return m[k]!=null?m[k]:a})}
function oclass(o){return o==='rejected'?'c-bad':(o==='resolved'||o==='local_repair')?'c-ok':(o==='linked_vendor'||o==='linked_known')?'c-info':'c-warn'}
function tag(p){return p?'<span class="tag '+p+'">'+p+'</span>':''}
function spine(){
  var h='<ol class="spine" aria-label="'+esc(t('spineT'))+'">';

    h+='<li class="sp'+(p?' '+p:'')+'"><b>'+esc(t('n_'+n))+'</b><small>'+esc(t('d_'+n))+'</small>'+tag(p)+'</li>';});
  return h+'</ol>';
}
function item(it){
  var o=it.outcome||'other';
  var oname=T.zh['o_'+o]!=null?t('o_'+o):t('o_other');
  var h='<article class="item" tabindex="0" aria-label="'+esc(loc(it.title))+'"><header><h3>'+esc(loc(it.title))+'</h3>';
  h+='<span class="chip '+oclass(o)+'">'+esc(oname)+'</span>';
  if(it.dry_run!==false)h+='<span class="chip c-warn">DRY RUN</span>';
  h+='</header>';
  if(it.parent)h+='<p class="parent">'+esc(t('parent'))+esc(loc(it.parent))+'</p>';
  var by={};(it.states||[]).forEach(function(s){by[s.name]=s});
  h+='<ol class="six">';
  SK.forEach(function(n){
    var s=by[n]||{};var p=s.plugin||'';
    h+='<li'+(p?' class="'+esc(p)+'"':'')+'><b>'+esc(t('n_'+n))+'</b>'+(p?'<span class="tag '+esc(p)+'" title="'+esc(t('changed'))+'">'+esc(p)+'</span>':'')+'<span>'+esc(s[lang]||s.zh||s.en||'—')+'</span></li>';
  });
  h+='</ol>';
  var hn=(it.held_actions||[]).length;

function lane(title,items,num){

function render(){

  document.querySelectorAll('[data-i18n]').forEach(function(e){e.textContent=t(e.getAttribute('data-i18n'))});
  document.querySelectorAll('#langSeg button').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-lang')===lang)});
  if(window.Theme)Theme.relabel();
  var D=window.INTEGRATED_V31,h='';
  h+='<section class="hero"><div class="eyebrow">v3.1 · '+esc(t('sim'))+'</div><h1>'+esc(t('h1'))+'</h1><p class="lead">'+esc(t('lead'))+'</p>';
  var S=(D&&D.summary)||{};
  if(D){
    h+='<div class="stats">';
    [['stItems','items'],['stVendor','vendor_linked'],['stHeld','held_actions'],['stRank','v2_ranked'],['stRej','rejected']].forEach(function(p){
      h+='<div class="stat"><span>'+esc(t(p[0]))+'</span><strong>'+esc(S[p[1]]!=null?S[p[1]]:'—')+'</strong></div>';});
    h+='</div>';
    if(D.generated_at)h+='<div class="eyebrow">'+esc(t('gen'))+' '+esc(String(D.generated_at).replace('T',' ').replace(/Z$/,' UTC'))+'</div>';
  }
  h+=spine();
  h+='<div class="legend"><span><span class="tag v3">v3</span>'+esc(t('leg3'))+'</span><span><span class="tag v2">v2</span>'+esc(t('leg2'))+'</span></div></section>';
  if(!D||!Array.isArray(D.items)){
    h+='<div class="empty"><b>'+esc(t('emptyT'))+'</b>'+esc(t('emptyD'))+'</div>';
  }else{
    var A1=D.items.filter(function(i){return i.app==='devices'}),A2=D.items.filter(function(i){return i.app==='servicedesk'});
    var teams=D.items.filter(function(i){var p=i.parent;return p&&/teams/i.test(typeof p==='string'?p:(p.en||'')+' '+(p.zh||''))});
    var ta=teams.filter(function(i){return i.app==='servicedesk'}).length,tb=teams.filter(function(i){return i.app==='devices'}).length;
    h+='<div class="callouts"><section class="call teams"><h2>'+esc(t('callTeams'))+'</h2><p>'+esc(t('teamsP'))+'</p><p><strong>'+esc((ta&&tb)?fmt(t('teamsCount'),{a:ta,b:tb}):t('teamsNone'))+'</strong></p></section>';
    h+='<section class="call safe"><h2>🛡 '+esc(t('callSafe'))+'</h2><ul><li>'+esc(t('safe1'))+'</li><li>'+esc(t('safe2'))+'</li></ul></section></div>';
    h+=lane(t('lane1'),A1,1)+lane(t('lane2'),A2,2);
    var C=D.closures||[];
    if(C.length){
      h+='<section class="lane"><h2>'+esc(t('closT'))+'</h2><div class="items">';
      C.forEach(function(c){var x=(typeof c==='string')?c:(loc(c.notice)||loc(c.title)||'');h+='<div class="closure">'+esc(x)+'</div>'});
      h+='</div></section>';
    }
  }
  h+='<h2 class="eyebrow">'+esc(t('linksT'))+'</h2><nav class="links" aria-label="'+esc(t('linksT'))+'">'+
    '<a href="guide-v3.1.html"><b>'+esc(t('lk0'))+'</b><span>'+esc(t('lk0d'))+'</span></a>'+
    '<a href="console.html"><b>'+esc(t('lk1'))+'</b><span>'+esc(t('lk1d'))+'</span></a>'+
    '<a href="evolution-v2.html"><b>'+esc(t('lk2'))+'</b><span>'+esc(t('lk2d'))+'</span></a>'+
    '<a href="global-intelligence-v3.html"><b>'+esc(t('lk3'))+'</b><span>'+esc(t('lk3d'))+'</span></a></nav>';
  document.getElementById('root').innerHTML=h;
}
function setLang(l){lang=l;try{localStorage.setItem('lang',l)}catch(e){}render()}
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('#langSeg button');if(b)setLang(b.getAttribute('data-lang'))});
document.addEventListener('keydown',function(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  var tg=e.target&&e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA')return;
  if(e.key==='l'||e.key==='L')setLang(lang==='zh'?'en':'zh');
  else if(e.key==='1'||e.key==='2'){var el=document.getElementById('lane'+e.key);if(el){el.focus();el.scrollIntoView({block:'start'})}}
});
render();
})();
</script>
</body>
