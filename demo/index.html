<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incident Skeleton — 骨架驱动四套班底</title>
<style>
  :root {
    --bg: #0d0a14;
    --panel: #1a1326;
    --panel2: #221a33;
    --ink: #f4ecd8;
    --muted: #9a8db0;
    --orange: #ff7b1c;
    --purple: #9b5de5;
    --green: #3ddc84;
    --red: #ff4d4d;
    --shared: #6b5b95;
    --plugged: #ff7b1c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "PingFang SC", "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 70% -10%, #2a1a3a 0%, var(--bg) 60%);
    color: var(--ink);
    min-height: 100vh;
    padding: 24px 18px 60px;
  }
  header { text-align: center; margin-bottom: 18px; }
  header h1 {
    margin: 0 0 4px;
    font-size: 26px;
    letter-spacing: .5px;
  }
  header h1 .skull { color: var(--orange); }
  header p { margin: 0; color: var(--muted); font-size: 13px; }

  /* ---- Crew picker ---- */
  .crew {
    display: flex; gap: 12px; justify-content: center;
    flex-wrap: wrap; margin: 18px 0 22px;
  }
  .crew button {
    background: var(--panel);
    border: 2px solid #3a2d52;
    color: var(--ink);
    border-radius: 14px;
    padding: 12px 16px;
    font-size: 15px;
    cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    transition: .15s;
  }
  .crew button:hover { border-color: var(--purple); transform: translateY(-2px); }
  .crew button.active {
    border-color: var(--orange);
    background: linear-gradient(180deg, #2a1c10, var(--panel));
    box-shadow: 0 0 0 3px rgba(255,123,28,.15);
  }
  .crew button .ico { font-size: 22px; }

  /* ---- Tombstone graveyard ---- */
  .graveyard {
    display: flex; gap: 14px; justify-content: center;
    margin: 0 auto 22px; max-width: 760px; min-height: 86px;
  }
  .tomb {
    width: 64px; text-align: center; opacity: .35; transition: .3s;
  }
  .tomb.up { opacity: 1; }
  .tomb .stone {
    font-size: 40px; line-height: 1; filter: grayscale(.6);
  }
  .tomb.up .stone { filter: none; }
  .tomb .lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .tomb.dead .stone { filter: drop-shadow(0 0 8px var(--red)); }
  .tomb.dead .lbl { color: var(--red); }

  /* ---- The skeleton state machine ---- */
  .machine {
    max-width: 760px; margin: 0 auto;
    background: var(--panel);
    border: 1px solid #322647;
    border-radius: 16px;
    padding: 18px;
  }
  .track { display: flex; flex-direction: column; gap: 8px; }
  .state {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel2);
    border: 1px solid #2e2444;
    border-radius: 12px;
    padding: 12px 14px;
    position: relative;
    opacity: .5; transition: .25s;
  }
  .state .n {
    flex: 0 0 26px; height: 26px; border-radius: 50%;
    background: #2a2038; color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
  }
  .state .name { font-weight: 600; min-width: 110px; }
  .state .desc { color: var(--muted); font-size: 13px; flex: 1; }
  .state .tag {
    font-size: 11px; padding: 2px 8px; border-radius: 20px;
    border: 1px solid #44355e; color: var(--muted);
  }
  .state.plugged .tag { color: var(--plugged); border-color: var(--plugged); }
  .state.shared .tag { color: var(--shared); border-color: var(--shared); }

  .state.active {
    opacity: 1; border-color: var(--orange);
    box-shadow: 0 0 0 2px rgba(255,123,28,.25);
    background: linear-gradient(180deg, #241830, var(--panel2));
  }
  .state.done { opacity: .85; border-color: var(--green); }
  .state.done .n { background: #15301f; color: var(--green); }
  .state.active .n { background: var(--orange); color: #1a0d00; }
  .state .spinner {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid #44355e; border-top-color: var(--orange);
    animation: spin .7s linear infinite; opacity: 0;
  }
  .state.active .spinner { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .state::after {
    content: ""; position: absolute; left: 25px; bottom: -9px;
    width: 2px; height: 8px; background: #44355e;
  }
  .state:last-child::after { display: none; }

  .controls {
    display: flex; gap: 10px; justify-content: center;
    margin-top: 18px; flex-wrap: wrap;
  }
  .controls button {
    background: var(--orange); color: #1a0d00; border: none;
    border-radius: 10px; padding: 11px 22px; font-size: 15px;
    font-weight: 600; cursor: pointer; transition: .15s;
  }
  .controls button:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .controls button.ghost {
    background: transparent; color: var(--muted); border: 1px solid #44355e;
  }
  .controls button:disabled { opacity: .4; cursor: not-allowed; transform: none; }

  .log {
    max-width: 760px; margin: 16px auto 0;
    background: #110b1c; border: 1px solid #2e2444; border-radius: 12px;
    padding: 12px 14px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px; color: var(--muted); max-height: 150px; overflow:auto;
  }
  .log .line { padding: 1px 0; }
  .log .line.ok { color: var(--green); }
  .log .line.warn { color: var(--orange); }
  .log .line.err { color: var(--red); }

  footer {
    text-align: center; margin-top: 26px; color: var(--muted); font-size: 12px;
  }
  footer b { color: var(--ink); }

  /* dancing skeleton */
  .dancer {
    position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%);
    font-size: 46px; opacity: 0; transition: opacity .4s; pointer-events: none;
  }
  .dancer.show { opacity: 1; animation: jig .6s ease-in-out infinite alternate; }
  @keyframes jig { from { transform: translateX(-50%) rotate(-8deg); } to { transform: translateX(-50%) rotate(8deg) translateY(-4px); } }

  .bats { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
  .bat { position: absolute; font-size: 22px; opacity: 0; }
</style>
</head>
<body>
  <header>
    <h1><span class="skull">💀</span> Incident Skeleton</h1>
    <p>「Skeleton Crew」原意=维持运转的最少班底。骨架=状态机核心，班底=每种设备挂上去的处理逻辑。一套骨架，四套班底，处理四种设备告警。</p>
  </header>

  <div class="crew" id="crew">
    <button data-crew="printer" class="active"><span class="ico">🖨️</span> 打印机</button>
    <button data-crew="signage"><span class="ico">📺</span> 数字标牌</button>
    <button data-crew="av"><span class="ico">🎥</span> 会议室音视频</button>
    <button data-crew="wifiap"><span class="ico">📶</span> 无线 AP</button>
  </div>

  <div class="graveyard" id="graveyard"></div>

  <div class="machine">
    <div class="track" id="track"></div>
    <div class="controls">
      <button id="fire">🔥 触发告警</button>
      <button id="reset" class="ghost">重置</button>
      <button id="runAll" class="ghost">连跑四套班底</button>
    </div>
  </div>

  <div class="log" id="log"><div class="line">就绪。选一套班底，点「触发告警」。</div></div>

  <div class="dancer" id="dancer">💃💀🕺</div>
  <div class="bats" id="bats"></div>

  <footer>
    Kiroween 2026 · Skeleton Crew · <b>同一套骨架，四种告警</b>
  </footer>

<script>
const SHARED = "shared", PLUGGED = "plugged";
// The skeleton — shared core, every alert walks these 6 states.
const SKELETON = [
  { n:1, name:"RECEIVE",    tag:SHARED,   desc:"告警进来：类型 / 严重度 / 来源 / 消息" },
  { n:2, name:"TRIAGE",     tag:SHARED,   desc:"分类 + 打分严重度，决定要不要动手" },
  { n:3, name:"INVESTIGATE",tag:PLUGGED,  desc:"为这类设备查上下文（班底逻辑）" },
  { n:4, name:"MITIGATE",   tag:PLUGGED,  desc:"为这类设备动手减影响（班底逻辑）" },
  { n:5, name:"RESOLVE",    tag:SHARED,   desc:"复查健康，确认恢复" },
  { n:6, name:"LOG",        tag:SHARED,   desc:"写事件记录 / 复盘" },
];

// The crew — each plugs its own INVESTIGATE + MITIGATE.
const CREW = {
  printer: {
    ico:"🖨️", label:"打印机", device:"打印机 HP-LJ-405",
    alert:{ type:"打印机故障", sev:"中", src:"SNMP 10.0.4.21", msg:"PAPER JAM (错误码 13.20)" },
    inv:["SNMP 查状态 → ERROR","查打印队列 → 3 个任务堆积","查网络 → 通","查错误码 13.20 → 定影器卡纸"],
    mit:["清纸 / 换耗材","重启打印后台","重新加设备","必要时断电重启"],
    resolve:"错误码清零，队列恢复，设备在线",
  },
  signage: {
    ico:"📺", label:"数字标牌", device:"标牌播放器 BS-12",
    alert:{ type:"标牌黑屏", sev:"高", src:"CMS / 大厅东", msg:"播放器离线 14 分钟" },
    inv:["ping 播放器 → 不通","查 CMS 排期 → 推送失败","查显示电源 → 亮（HDMI 信号丢）","查网络 → 端口 down"],
    mit:["重启播放器","重推内容 / 排期","重插 HDMI","换备用播放器"],
    resolve:"播放器在线，内容恢复轮播",
  },
  av: {
    ico:"🎥", label:"会议室音视频", device:"会议室 AV-ROOM-3F",
    alert:{ type:"进不了会", sev:"高", src:"Zoom Rooms / 3F-301", msg:"无法加入会议，控制器面板卡死" },
    inv:["查控制器 → 无响应","查编解码器 → 在线但挂起","查 Zoom Rooms 状态 → 离线","测麦/摄 → 未枚举"],
    mit:["重启控制器 / 编解码器","重启房间应用","重插 USB 设备","派 AV 工程师到场"],
    resolve:"房间重新上线，会议已加入",
  },
  wifiap: {
    ico:"📶", label:"无线 AP", device:"无线 AP AP-3F-12",
    alert:{ type:"AP 离线/掉线", sev:"高", src:"控制器 / 楼层3", msg:"AP 离线，多个客户端掉线" },
    inv:["ping AP → 不通","控制器 API 查 AP 状态 → down","查 PoE 端口 → 端口 down","查客户端数 → 大面积掉线"],
    mit:["控制器 API 重启 AP","PoE 端口断电再上电","射频调优（换信道/功率）","补 AP / 换设备"],
    resolve:"AP 上线，客户端重新关联",
  },
};

let current = "printer";
let running = false;

const track = document.getElementById("track");
const logEl = document.getElementById("log");
const graveyard = document.getElementById("graveyard");
const dancer = document.getElementById("dancer");
const batsEl = document.getElementById("bats");

function renderTrack(){
  track.innerHTML = "";
  SKELETON.forEach(s => {
    const el = document.createElement("div");
    el.className = "state " + s.tag;
    el.dataset.n = s.n;
    el.innerHTML = `
      <span class="spinner"></span>
      <span class="n">${s.n}</span>
      <span class="name">${s.name}</span>
      <span class="desc">${s.desc}</span>
      <span class="tag">${s.tag===SHARED?"共享":"班底"}</span>`;
    track.appendChild(el);
  });
}
function renderGraveyard(){
  graveyard.innerHTML = "";
  Object.entries(CREW).forEach(([k,c]) => {
    const t = document.createElement("div");
    t.className = "tomb up"; t.dataset.k = k;
    t.innerHTML = `<div class="stone">🪦</div><div class="lbl">${c.ico} ${c.label}</div>`;
    graveyard.appendChild(t);
  });
}
function pickCrew(k){
  current = k;
  document.querySelectorAll("#crew button").forEach(b => b.classList.toggle("active", b.dataset.crew===k));
}
document.getElementById("crew").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  pickCrew(b.dataset.crew);
});

function logLine(msg, cls){
  const d = document.createElement("div");
  d.className = "line" + (cls?(" "+cls):"");
  const ts = new Date().toLocaleTimeString("zh-CN");
  d.textContent = `[${ts}] ${msg}`;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}

function setTomb(k, dead){
  const t = graveyard.querySelector(`.tomb[data-k="${k}"]`);
  if(t) t.classList.toggle("dead", !!dead);
}

function flyBats(){
  for(let i=0;i<6;i++){
    const b = document.createElement("div");
    b.className = "bat"; b.textContent = "🦇";
    b.style.left = Math.random()*100 + "%";
    b.style.top = (Math.random()*40) + "%";
    batsEl.appendChild(b);
    requestAnimationFrame(()=>{
      b.style.transition = "all 2.2s ease-in";
      b.style.opacity = "0.9";
      b.style.transform = `translate(${(Math.random()-.5)*300}px, ${200+Math.random()*200}px)`;
      setTimeout(()=>b.style.opacity="0", 1800);
      setTimeout(()=>b.remove(), 2400);
    });
  }
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function runIncident(k){
  const c = CREW[k];
  pickCrew(k);
  running = true;
  document.getElementById("fire").disabled = true;
  setTomb(k, true);
  flyBats();
  logEl.innerHTML = "";

  // reset states
  document.querySelectorAll(".state").forEach(s => s.classList.remove("active","done"));

  logLine(`告警进来：${c.alert.type}（${c.alert.sev}） — ${c.device} — ${c.alert.msg}`, "warn");

  const steps = [...SKELETON];
  for(const s of steps){
    const el = track.querySelector(`.state[data-n="${s.n}"]`);
    el.classList.add("active");
    let detail = s.desc;
    if(s.name === "INVESTIGATE"){
      for(const line of c.inv){ await sleep(650); logLine("  ↳ "+line); }
      detail = "查完，定位到根因";
    } else if(s.name === "MITIGATE"){
      for(const line of c.mit){ await sleep(650); logLine("  ↳ "+line, "warn"); }
      detail = "处理完成，等恢复";
    } else if(s.name === "TRIAGE"){
      await sleep(700);
      logLine(`  类型=${c.alert.type}，严重度=${c.alert.sev} → 动手`);
    } else if(s.name === "RECEIVE"){
      await sleep(700);
    } else if(s.name === "RESOLVE"){
      await sleep(700);
      logLine("  "+c.resolve, "ok");
      setTomb(k, false);
    } else if(s.name === "LOG"){
      await sleep(500);
      logLine("  已写入事件记录 + 复盘", "ok");
    }
    el.classList.remove("active"); el.classList.add("done");
    await sleep(180);
  }

  // skeleton dances on RESOLVE
  dancer.classList.add("show");
  logLine(`✅ ${c.label} 事件已闭环（同一套骨架）`, "ok");
  await sleep(1600);
  dancer.classList.remove("show");

  running = false;
  document.getElementById("fire").disabled = false;
}

document.getElementById("fire").addEventListener("click", ()=>{
  if(running) return;
  runIncident(current);
});
document.getElementById("reset").addEventListener("click", ()=>{
  if(running) return;
  document.querySelectorAll(".state").forEach(s => s.classList.remove("active","done"));
  Object.keys(CREW).forEach(k => setTomb(k,false));
  logEl.innerHTML = '<div class="line">已重置。选一套班底，点「触发告警」。</div>';
});
document.getElementById("runAll").addEventListener("click", async ()=>{
  if(running) return;
  for(const k of Object.keys(CREW)){ await runIncident(k); await sleep(500); }
  logLine("🦴 四套班底跑完 — 同一套骨架，四种告警。", "ok");
});

renderTrack();
renderGraveyard();
</script>
</body>
</html>
