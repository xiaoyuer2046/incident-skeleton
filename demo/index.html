<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incident Skeleton — 一套骨架，四套班底</title>
<style>
:root{
  --ink:#0a0712; --panel:rgba(22,15,36,.74); --line:rgba(190,170,255,.14);
  --bone:#efe6cf; --text:#efe9dc; --muted:#9a90b3;
  --ember:#ff7a1a; --violet:#8b5cf6; --ghost:#5dffb0; --blood:#ff3d57; --amber:#ffc24a;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --serif:ui-serif,"Songti SC",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--ink);color:var(--text);
  font-family:-apple-system,"PingFang SC","Segoe UI",system-ui,sans-serif;overflow-x:hidden}

/* ---------- night sky ---------- */
.sky{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:
   radial-gradient(900px 520px at 82% -8%,rgba(139,92,246,.30),transparent 62%),
   radial-gradient(700px 480px at 6% 108%,rgba(255,122,26,.16),transparent 60%),
   linear-gradient(180deg,#0d0818 0%,#0a0712 55%,#07050d 100%)}
.moon{position:absolute;top:22px;right:27%;width:92px;height:92px;border-radius:50%;
  background:radial-gradient(circle at 36% 34%,#fff7e0,#e9dcb4 58%,#b9ab89);
  box-shadow:0 0 70px 18px rgba(255,236,190,.22),0 0 220px 60px rgba(139,92,246,.20);opacity:.92}
.fog{position:absolute;left:-30%;width:160%;height:260px;filter:blur(36px);opacity:.5;
  background:radial-gradient(closest-side,rgba(150,120,220,.30),transparent 70%);
  animation:drift 46s linear infinite alternate}
.fog.f1{bottom:-60px}
.fog.f2{bottom:30px;animation-duration:64s;animation-direction:alternate-reverse;opacity:.32}
@keyframes drift{from{transform:translateX(-8%)}to{transform:translateX(8%)}}
#stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.5;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.85}}

/* ---------- bats ---------- */
#bats{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.bat{position:absolute;left:-70px;width:44px;color:#1b1030;
  animation:batfly var(--d,5s) linear forwards}
.bat svg{display:block;width:100%;animation:flap .22s ease-in-out infinite alternate;
  filter:drop-shadow(0 0 6px rgba(139,92,246,.7))}
@keyframes batfly{to{transform:translateX(calc(100vw + 140px)) translateY(var(--dy,40px))}}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.45)}}

/* ---------- layout ---------- */
.app{position:relative;z-index:2;max-width:1280px;margin:0 auto;padding:30px 28px 40px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:30px}
.brand h1{margin:0;font:600 40px/1.05 var(--serif);letter-spacing:.01em}
.brand h1 em{font-style:italic;background:linear-gradient(95deg,#ffb15e,var(--ember) 45%,#ff4d6d);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{margin:10px 0 0;color:var(--muted);font-size:14px;max-width:800px;line-height:1.7}
.brand p b{color:var(--text);font-weight:600}
.badge{font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ember);
  border:1px solid rgba(255,122,26,.4);padding:7px 12px;border-radius:999px;background:rgba(255,122,26,.07)}
.legend{display:flex;gap:18px;margin-top:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.legend .b{background:linear-gradient(#f3ead2,#b8aa88)}
.legend .c{background:#1d1022;border:1.5px solid var(--ember)}

.stage{position:relative;display:grid;grid-template-columns:268px minmax(340px,1fr) 392px;gap:30px;align-items:start}
.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:1}
.stage>aside,.stage>section{position:relative;z-index:2}
.links path{fill:none;stroke:var(--ember);stroke-width:2;opacity:.28;stroke-dasharray:3 7;stroke-linecap:round}
.links path.hot{opacity:1;stroke-width:2.6;filter:drop-shadow(0 0 7px var(--ember));animation:flow .7s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}

/* ---------- crew roster ---------- */
.roster{display:flex;flex-direction:column;gap:14px}
.rtitle{font:600 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 2px 2px}
.crewcard{display:flex;align-items:center;gap:13px;padding:14px;border:1px solid var(--line);border-radius:16px;
  background:var(--panel);backdrop-filter:blur(10px);cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;outline:none}
.crewcard:hover,.crewcard:focus-visible{transform:translateX(4px);border-color:rgba(255,122,26,.55)}
.crewcard.active{border-color:var(--ember);box-shadow:0 0 0 1px rgba(255,122,26,.35),0 14px 44px -14px rgba(255,122,26,.5)}
.crewcard .ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;
  background:rgba(255,255,255,.05);color:var(--bone);transition:.2s}
.crewcard .ico svg{width:23px;height:23px}
.crewcard.active .ico{color:var(--ember);background:rgba(255,122,26,.13)}
.meta{min-width:0;flex:1}
.nm{font-weight:600;font-size:15px}
.dev{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pips{display:flex;gap:4px;margin-top:9px}
.pip{width:18px;height:4px;border-radius:2px;background:rgba(255,255,255,.12);transition:.25s}
.pip.ok{background:var(--ghost);box-shadow:0 0 8px rgba(93,255,176,.6)}
.pip.bad{background:var(--blood);box-shadow:0 0 8px rgba(255,61,87,.7)}
.st{width:10px;height:10px;border-radius:50%;flex:none;background:var(--ghost);box-shadow:0 0 10px var(--ghost);transition:.3s}
.st.down{background:var(--blood);box-shadow:0 0 14px var(--blood);animation:pulse 1s ease-in-out infinite}
.st.blip{background:var(--amber);box-shadow:0 0 12px var(--amber)}
@keyframes pulse{50%{transform:scale(1.5);opacity:.6}}

/* ---------- the spine ---------- */
.spine svg{width:100%;height:auto;max-height:calc(100vh - 330px);min-height:420px;display:block;overflow:visible;margin:0 auto}
.v{opacity:.5;transition:opacity .35s,filter .35s}
.v .bone *{fill:url(#boneG);stroke:#6f6246;stroke-width:1.2;transition:fill .3s,stroke .3s}
.v.crew .bone *{fill:#1d1022;stroke:var(--ember);stroke-width:1.7}
.v .num{fill:#3a2f1c;font:700 14px var(--mono)}
.v.crew .num{fill:var(--ember)}
.v .nm2{fill:var(--text);font:600 13px var(--mono);letter-spacing:.09em}
.v .zh{fill:var(--muted);font:12px -apple-system,"PingFang SC",sans-serif}
.v .tg{fill:#7d7298;font:600 10px var(--mono);letter-spacing:.12em}
.v.crew .tg{fill:var(--ember)}
.v .lead{stroke:rgba(190,170,255,.25);stroke-width:1}
.socket{fill:#120d1e;stroke:var(--ember);stroke-width:2;transition:.25s}
.v.active{opacity:1;filter:drop-shadow(0 0 13px rgba(255,122,26,.85))}
.v.active .socket{fill:var(--ember)}
.v.done{opacity:1}
.v.done .bone *{stroke:var(--ghost)}
.v.done.crew .bone *{fill:#0e2a1e}
.v.done .num{fill:var(--ghost)}
#prog{fill:url(#progG);transform-box:fill-box;transform-origin:top;transform:scaleY(0);transition:transform .8s cubic-bezier(.6,0,.2,1)}
#orb{transition:transform .8s cubic-bezier(.6,0,.2,1)}
#orb .halo{fill:rgba(255,122,26,.25);animation:halo 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes halo{50%{transform:scale(1.6);opacity:.3}}
.skull path,.skull ellipse{fill:url(#boneG);stroke:#6f6246;stroke-width:1.3}
.skull .eye{fill:#0a0712;stroke:none;transition:.3s}
.skull .nose{fill:#0a0712;stroke:none}
.skull .teeth{stroke:#6f6246;stroke-width:1.4;fill:none}
#spine.alert .eye{fill:var(--blood);filter:drop-shadow(0 0 7px var(--blood))}
#spine.ok .eye{fill:var(--ghost);filter:drop-shadow(0 0 7px var(--ghost))}
#jaw{transition:transform .2s}
#spine.grin #jaw{animation:chomp .42s ease-in-out infinite}
@keyframes chomp{50%{transform:translateY(7px)}}
.coccyx rect{fill:url(#boneG);opacity:.28}

/* ---------- side cards ---------- */
.side{display:flex;flex-direction:column;gap:18px}
.card{border:1px solid var(--line);border-radius:18px;background:var(--panel);backdrop-filter:blur(10px);overflow:hidden}
.card h3{margin:0;padding:12px 16px;font:600 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.lights{display:inline-flex;gap:6px}
.lights i{width:9px;height:9px;border-radius:50%;background:#3b3052;display:inline-block}
.lights i:nth-child(1){background:#ff5f56}.lights i:nth-child(2){background:#ffbd2e}.lights i:nth-child(3){background:#27c93f}
.tag-sim{margin-left:auto;font-size:10px;color:var(--amber);border:1px solid rgba(255,194,74,.4);padding:2px 8px;border-radius:999px}
#log{height:218px;overflow:auto;padding:12px 16px;font:12.5px/1.75 var(--mono);color:#cfc6e6}
#log .ln{animation:rise .3s ease both}
#log .ok{color:var(--ghost)}#log .err{color:var(--blood)}#log .warn{color:var(--amber)}#log .dim{color:#7d7298}#log .st2{color:var(--ember)}
@keyframes rise{from{opacity:0;transform:translateY(5px)}}
.case{display:grid;grid-template-columns:64px 1fr;gap:6px 12px;padding:12px 16px;font-size:13px}
.case dt{color:var(--muted);font-size:12px;padding-top:1px}
.case dd{margin:0;min-height:18px;transition:color .3s}
.case dd.filled{color:var(--text);animation:rise .35s ease both}
.case dd.sev-高{color:var(--blood)}.case dd.sev-中{color:var(--amber)}
.stamp{margin:0 16px 12px;padding:9px 12px;border:1px dashed rgba(93,255,176,.5);border-radius:10px;
  color:var(--ghost);font:600 12px var(--mono);letter-spacing:.06em;opacity:0;transition:.4s}
.stamp.on{opacity:1}


.hright{display:flex;flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.lang button{all:unset;cursor:pointer;padding:7px 16px;font:600 12px var(--mono);color:var(--muted)}
.lang button[aria-pressed=true]{background:rgba(255,122,26,.16);color:var(--ember)}
.lang button:focus-visible{outline:2px solid var(--violet);outline-offset:-2px}
.lang button:disabled{opacity:.5;cursor:not-allowed}
.v.fault{opacity:1;filter:drop-shadow(0 0 12px rgba(255,61,87,.8))}
.v.fault .bone *{stroke:var(--blood)}.v.fault .num{fill:var(--blood)}
.stamp.bad{border-color:rgba(255,61,87,.55);color:var(--blood)}
.case dd[data-f=learn],.case dd[data-f=tkt]{line-height:1.5}

/* ---------- dock ---------- */
.dock{position:sticky;bottom:20px;z-index:20;width:max-content;max-width:100%;margin:34px auto 0;display:flex;gap:10px;flex-wrap:wrap;
  justify-content:center;padding:10px;border:1px solid var(--line);border-radius:999px;background:rgba(14,9,24,.82);backdrop-filter:blur(14px);
  box-shadow:0 18px 60px -18px #000}
.dock button{font:600 14px -apple-system,"PingFang SC",sans-serif;border:1px solid transparent;border-radius:999px;padding:11px 22px;
  cursor:pointer;color:var(--text);background:transparent;transition:.18s}
.dock button:hover:not(:disabled){background:rgba(255,255,255,.07)}
.dock button.primary{background:linear-gradient(135deg,#ff9a3c,var(--ember) 55%,#ff4d6d);color:#1b0b00;box-shadow:0 8px 28px -8px var(--ember)}
.dock button.primary:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
.dock button:disabled{opacity:.4;cursor:not-allowed}
.dock button:focus-visible,.crewcard:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
footer{margin-top:22px;text-align:center;color:#6f6588;font-size:12px}

@media (max-width:1020px){
  .stage{grid-template-columns:1fr}
  .roster{display:grid;grid-template-columns:1fr 1fr}
  .rtitle{grid-column:1/-1}
  .links{display:none}
  .spine svg{max-height:none;max-width:520px;margin:0 auto}
  .brand h1{font-size:32px}
}
@media (prefers-reduced-motion:reduce){
  .fog,#stars i,.st.down,#orb .halo,#spine.grin #jaw,.links path.hot{animation:none}
  #orb,#prog{transition-duration:.01s}
}
</style>
</head>
<body>
<div class="sky"><div class="moon"></div><div class="fog f1"></div><div class="fog f2"></div><div id="stars"></div></div>
<div id="bats" aria-hidden="true"></div>

<div class="app">
  <header>
    <div class="brand">
      <h1>Incident <em>Skeleton</em></h1>
      <p id="tagline"></p>
      <div class="legend"><span><i class="b"></i><span data-i18n="legend_shared"></span></span><span><i class="c"></i><span data-i18n="legend_crew"></span></span></div>
    </div>
    <div class="hright">
      <div class="lang" role="group" aria-label="Language / 语言">
        <button type="button" data-lang="zh" aria-pressed="false">中文</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <a class="badge" href="console.html" style="text-decoration:none">▶ Ops console</a><a class="badge" href="servicenow.html" style="text-decoration:none">ServiceNow (sim)</a><div class="badge">Kiroween 2026 · Skeleton Crew</div>
    </div>
  </header>

  <main class="stage" id="stage">
    <svg class="links" id="links" aria-hidden="true"></svg>
    <aside class="roster" id="roster"></aside>
    <section class="spine"><svg id="spine" viewBox="0 0 470 620" role="img"></svg></section>
    <aside class="side">
      <div class="card">
        <h3><span class="lights"><i></i><i></i><i></i></span><span data-i18n="log_title"></span></h3>
        <div id="log" aria-live="polite"></div>
      </div>
      <div class="card">
        <h3><span data-i18n="case_title"></span> <span class="tag-sim" data-i18n="sim"></span></h3>
        <dl class="case">
          <dt data-i18n="f_dev"></dt><dd data-f="dev">—</dd>
          <dt data-i18n="f_sym"></dt><dd data-f="sym">—</dd>
          <dt data-i18n="f_sev"></dt><dd data-f="sev">—</dd>
          <dt data-i18n="f_grp"></dt><dd data-f="grp">—</dd>
          <dt data-i18n="f_root"></dt><dd data-f="root">—</dd>
          <dt data-i18n="f_fix"></dt><dd data-f="fix">—</dd>
          <dt data-i18n="f_res"></dt><dd data-f="res">—</dd>
          <dt data-i18n="f_tkt"></dt><dd data-f="tkt">—</dd>
          <dt data-i18n="f_learn"></dt><dd data-f="learn">—</dd>
        </dl>
        <div class="stamp" id="stamp"></div>
      </div>
    </aside>
  </main>

  <nav class="dock">
    <button class="primary" id="fire" data-i18n="fire"></button>
    <button id="patrol" data-i18n="patrol"></button>
    <button id="fail" data-i18n="fail"></button>
    <button id="runAll" data-i18n="runAll"></button>
    <button id="reset" data-i18n="reset"></button>
  </nav>
  <footer data-i18n="footer"></footer>
</div>

<script>
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

 }
};
let lang = 'en';
try {
  const q = new URLSearchParams(location.search).get('lang');
  const saved = localStorage.getItem('lang');
  lang = (q === 'zh' || q === 'en') ? q : (saved === 'zh' || saved === 'en') ? saved : ((navigator.language || 'en').toLowerCase().startsWith('zh') ? 'zh' : 'en');
} catch (e) { lang = ((navigator.language || 'en').toLowerCase().startsWith('zh')) ? 'zh' : 'en'; }
const t = (k, n) => { const s = (I18N[lang][k] ?? I18N.en[k] ?? k); return n === undefined ? s : s.replace('%n', n); };

  $('#log').appendChild(d); $('#log').scrollTop = 1e6;

function log(m, cls){ const e = {m, cls}; LOGS.push(e); addLogLine(e); }
function clearLog(){ LOGS.length = 0; $('#log').innerHTML = ''; }
function relog(){ $('#log').innerHTML = ''; LOGS.forEach(addLogLine); }
function setCase(o){ Object.assign(CASE, o); renderCase(); }
function renderCase(){
  document.querySelectorAll('[data-f]').forEach(el => {
    const k = el.dataset.f, p = CASE[k];
    if(p === undefined){ el.textContent = '—'; el.className = ''; return; }

    el.textContent = v; el.className = 'filled' + (k==='sev' && CASE._sev ? ' sev-' + CASE._sev : '');
  });

  st.className = 'stamp' + (stampKey ? ' on' : '') + (stampBad ? ' bad' : '');

}
function resetCase(){ for(const k in CASE) delete CASE[k]; stampKey = null; stampBad = false; renderCase(); }
const lock = b => { busy = b; document.querySelectorAll('.dock button').forEach(x => x.disabled = b); document.querySelectorAll('.lang button').forEach(x => x.disabled = b); };

const riskText = r => t('risk_'+r);

/* ================= one incident walks the skeleton ================= */
// mode 'ok': the second automatic fix works. mode 'fail': nothing works, a person is needed.
async function runIncident(k, mode){
  mode = mode || 'ok';
  const c = CREW[k];
  pick(k); lock(true);
  resetSpine(); resetCase(); clearLog();
  $('#spine').classList.add('alert'); setStatus(k,'down'); flyBats();
  log(() => `${t('alert')}: ${L(c.alert.type)} · ${L(c.device)}`, 'warn');
  log(() => '  ' + L(c.alert.msg), 'dim');
  const q = REDUCED ? 0.2 : 1;
  let failed = false;
  for(const s of STATES){
    setActive(s.n);
    log(() => `[${s.n}/6] ${s.name} · ${L(s)}${s.kind==='crew'?t('crewmark'):''}`, 'st2');
    await sleep(750*q);
    if(s.name==='RECEIVE'){ setCase({dev: () => L(c.device), sym: () => L(c.alert.msg)}); }
    if(s.name==='TRIAGE'){
      log(() => `  ${t('triage_sev')} ${t(c.alert.sev==='high'?'risk_high':'risk_medium').replace(/风险| risk/,'')} → ${t('triage_act')}`);
      log(() => `  ${t('route')} → ${c.group}${t('sim_tag')}`, 'dim');
      setCase({_sev: c.alert.sev, sev: () => (lang==='zh' ? (c.alert.sev==='high'?'高':'中') : c.alert.sev), grp: () => c.group});
    }
    if(s.name==='INVESTIGATE'){
      for(const l of c.inv){ log(() => '  ✓ ' + L(l)); await sleep(520*q); }
      setCase({root: () => L(c.root)});
    }
    if(s.name==='MITIGATE'){
      let fixed = false;
      for(let i=0;i<c.steps.length && !fixed;i++){
        const st = c.steps[i];
        const ok = mode==='ok' && i===c.fixAt;
        log(() => `  → ${L(st)}  [${riskText(st.risk)} · ${tierText(st.risk)}]  ${ok ? t('recovered') : t('notrec')}`, ok ? 'ok' : 'warn');
        await sleep(620*q);
        if(ok){ fixed = true; setCase({fix: () => L(c.fix)}); }
      }
      if(!fixed){
        for(const h of c.human){ log(() => `  · ${L(h)}  [${t('human')}]`, 'dim'); await sleep(380*q); }
        setCase({fix: () => lang==='zh' ? '自动修法都没恢复，需要人' : 'No automatic fix recovered it; a person is needed'});
        failed = true;
      }
    }
    if(s.name==='RESOLVE'){
      if(!failed){ log(() => '  ' + L(c.res), 'ok'); setCase({res: () => L(c.res)}); setStatus(k,''); }
      else { log(() => '  ' + t('notrec'), 'err'); setCase({res: () => t('notrec')}); }
    }
    if(s.name==='LOG'){
      if(!failed){
        log(() => '  ' + t('logged'), 'ok');
        setCase({learn: () => L(c.learnOk)}); stampKey = 'stamp_ok'; renderCase();
      } else {
        const num = 'DRYRUN-INC' + String(1 + Math.floor(Math.random()*9)).padStart(4,'0');
        log(() => t('esc_head'), 'err');
        log(() => `  ${t('esc_done')}: ` + c.steps.map(x => L(x)).join(' → '), 'warn');
        log(() => `  ${t('esc_left')}: ` + c.human.map(x => L(x)).join(' / '), 'dim');
        log(() => `  ${t('esc_cause')}: ` + L(c.root), 'dim');
        log(() => `  ${t('esc_ticket')} ${num} → ${c.group} ${t('esc_note')}`, 'st2');
        setCase({tkt: () => `${num} → ${c.group}`, learn: () => L(c.learnFail)});
        stampKey = 'stamp_bad'; stampBad = true; renderCase();
      }
    }
    if(failed && s.name==='RESOLVE') markFault(s.n); else markDone(s.n);
    await sleep(220*q);
  }
  $('#spine').classList.remove('alert');
  if(!failed){
    $('#spine').classList.add('ok','grin');
    log(() => `✔ ${L(c.label)}: ${t('closed')}`, 'ok');
    await sleep(1700*q);
    $('#spine').classList.remove('grin');
  } else {
    $('#spine').classList.add('alert');
    log(() => `✖ ${L(c.label)}: ${t('stamp_bad')}`, 'err');
    await sleep(900*q);
  }
  lock(false);
}

async function patrol(){
  lock(true); resetAll();
  log(() => t('patrol_start'), 'warn');
  log(() => '  ' + t('patrol_rule'), 'dim');
  const plan = {printer:[1,1,1], signage:[1,0,1], av:[0,0,0], wifiap:[1,1,1]};
  const keys = Object.keys(CREW);
  const fails = await Promise.all(keys.map(async k => {
    let f = 0;
    for(let r=0;r<3;r++){
      await sleep(520 + Math.random()*420);
      const ok = plan[k][r]; if(!ok) f++;
      setPip(k,r,ok);
      log(() => `  ${L(CREW[k].label)} ${t('probe', r+1)}${ok ? t('ok') : t('fail_')}`, ok?'ok':'err');
    }
    return f;
  }));
  const confirmed = [];
  keys.forEach((k,i) => {
    if(fails[i] >= 2){ confirmed.push(k); setStatus(k,'down'); log(() => `${L(CREW[k].label)}: ${t('p_down', fails[i])}`, 'err'); }
    else if(fails[i] === 1){ setStatus(k,'blip'); log(() => `${L(CREW[k].label)}: ${t('p_blip')}`, 'warn'); }
    else { log(() => `${L(CREW[k].label)}: ${t('p_ok')}`, 'ok'); }
  });
  await sleep(900);
  lock(false);
  for(const k of confirmed) await runIncident(k, 'ok');
}

/* ================= language switch ================= */
function applyLang(){
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
  $('#tagline').innerHTML = t('tagline');
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  renderRoster(); labelSpine(); relog(); renderCase(); drawLinks();
}
document.querySelector('.lang').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b || busy) return;
  lang = b.dataset.lang;
  try { localStorage.setItem('lang', lang); } catch(err) {}
  applyLang();
});

$('#fire').addEventListener('click', () => { if(!busy) runIncident(current, 'ok'); });
$('#patrol').addEventListener('click', () => { if(!busy) patrol(); });
$('#fail').addEventListener('click', () => { if(!busy) runIncident('wifiap', 'fail'); });
$('#runAll').addEventListener('click', async () => {
  if(busy) return;
  for(const k of Object.keys(CREW)){ await runIncident(k, 'ok'); await sleep(400); }
  log(() => '🦴 ' + t('alldone'), 'ok');
});
$('#reset').addEventListener('click', () => { if(!busy){ resetAll(); log(() => t('reset_msg'), 'dim'); log(() => t('ready'), 'dim'); } });

renderSpine(); applyLang();
log(() => t('ready'), 'dim');
requestAnimationFrame(drawLinks);

// ?auto=printer|signage|av|wifiap|fail|patrol  starts a run on load (used for screenshots); ?lang=zh|en
const auto = new URLSearchParams(location.search).get('auto');
if(auto === 'patrol') patrol(); else if(auto === 'fail') runIncident('wifiap','fail'); else if(CREW[auto]) runIncident(auto,'ok');
</script>
