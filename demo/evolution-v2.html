<style>

html[data-theme=day]{color-scheme:light;--ink:#f5f3f8;--panel:#fff;--panel2:#f7f5fa;--line:rgba(55,36,92,.12);--line2:rgba(55,36,92,.22);--text:#211c2c;--muted:#625a73;--dim:#8a8299;--ember:#d95700;--violet:#6941d9;--ghost:#137f50;--blood:#ca2941;--amber:#9a6200;--sky:#1d68bf}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(900px 460px at 80% -8%,rgba(139,92,246,.18),transparent 62%),var(--ink);color:var(--text);font:14px/1.55 -apple-system,"PingFang SC","Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit}.skip{position:fixed;left:12px;top:-60px;z-index:100;padding:8px 12px;background:var(--panel);color:var(--text);border:2px solid var(--violet);border-radius:8px}.skip:focus{top:12px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:13px clamp(16px,3vw,34px);background:color-mix(in srgb,var(--ink) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{font:600 18px ui-serif,Georgia,serif;white-space:nowrap}.brand em{font-style:italic;color:var(--ember)}.brand small{display:block;font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.dry{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid rgba(255,194,74,.45);border-radius:999px;color:var(--amber);font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase}.dry::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--amber)}
.ctrl{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden}.seg button{border:0;background:transparent;padding:6px 11px;cursor:pointer;font:600 12px var(--mono);color:var(--muted)}.seg button[aria-pressed=true]{background:rgba(255,122,26,.16);color:var(--ember)}

.shell{width:min(1440px,100%);margin:auto;padding:clamp(18px,3vw,34px)}

.eyebrow{font:650 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}.score-copy h1{margin:3px 0 2px;font:650 18px/1.25 ui-serif,Georgia,serif}.score-copy p{margin:0;color:var(--muted);font-size:12px}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{grid-column:span 6;min-width:0;border:1px solid var(--line);border-radius:17px;background:var(--panel);overflow:hidden}.card.wide{grid-column:span 12}.card h2{margin:0;padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;font:650 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.card h2 span:first-child{color:var(--text);font-size:14px}.card h2 .meta{margin-left:auto;text-align:right;font-weight:500;letter-spacing:0;text-transform:none}.body{padding:14px 15px}
.timeline{position:relative;margin-left:9px}.timeline::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:1px;background:var(--line2)}.event{position:relative;display:grid;grid-template-columns:74px 104px 1fr;gap:10px;padding:8px 0 10px 25px}.event::before{content:"";position:absolute;left:1px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--dim);border:2px solid var(--panel)}.event.promoted::before{background:var(--ghost)}.event.demoted::before,.event.rejected::before{background:var(--blood)}.event.notice::before{background:var(--sky)}.event.changed::before,.event.discovered::before{background:var(--amber)}.event .time{font:650 11px var(--mono);color:var(--muted)}.event .kind{font:650 10px var(--mono);text-transform:uppercase;color:var(--dim)}.event p{margin:0}.event .sub{margin-top:2px;color:var(--muted);font-size:11.5px;overflow-wrap:anywhere}

@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}

  <footer class="foot"><span data-i18n="footer"></span><strong data-i18n="dryFoot"></strong></footer>

const D=window.EVOLUTION_V2;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tr=(k,m)=>{let s=I[lang][k]??I.en[k]??k;if(m)Object.entries(m).forEach(([a,b])=>s=s.split('%'+a).join(b));return s};
const loc=(v,host)=>{if(v&&typeof v==='object')return v[lang]??v.en??v.zh??'';if(host&&lang==='zh')return host.text_zh??host.message_zh??host.reason_zh??v??'';return v??''};
const textOf=o=>loc(o?.text??o?.message??o?.description??o?.title??o?.reason??'',o);
const kindOf=o=>String(o?.kind??o?.event??(o?.status==='rejected'?'rejected':undefined)??o?.diff??o?.new_state??o?.status??o?.state??o?.type??'observed').toLowerCase().replace(/\s+/g,'_');
const timeOf=(o,c)=>String(o?.ts??o?.created_at??o?.updated_at??c?.ts??'');
const formatTime=v=>{if(!v)return '—';if(/^\d\d:\d\d/.test(v))return v.slice(0,5);const raw=String(v),d=new Date(raw);return Number.isNaN(d.valueOf())?raw:(raw.endsWith('Z')?raw.replace('T',' ').replace(/Z$/,' UTC'):raw.replace('T',' '))};
const label=k=>{const key={source_change:'sourceChange',verified_outcome:'verifiedOutcome',regression:'regression',promoted:'promotedState',demoted:'demotedState'}[k]||k;return tr(key)};
let selected=-1;
function setLanguage(next){lang=next;document.documentElement.lang=lang;try{localStorage.setItem('lang',lang)}catch(e){};document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=tr(el.dataset.i18n));document.querySelectorAll('#langSeg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));if(window.Theme)Theme.relabel();render()}
$('#langSeg').addEventListener('click',e=>{const b=e.target.closest('button[data-lang]');if(b)setLanguage(b.dataset.lang)});
function empty(message,help=''){return `<div class="empty"><b>${esc(message)}</b>${help?`<span>${esc(help)}</span>`:''}</div>`}
function selectedCycles(){if(!D||!Array.isArray(D.cycles))return[];return selected<0?D.cycles:D.cycles[selected]?[D.cycles[selected]]:[]}
function value(o,...keys){for(const k of keys)if(o&&o[k]!==undefined&&o[k]!==null)return o[k];return''}
function allEvents(cycles){const out=[];cycles.forEach(c=>{(c.source_events||[]).forEach(x=>out.push({type:'sourceEvent',raw:x,c}));(c.method_events||[]).forEach(x=>out.push({type:'methodEvent',raw:x,c}));(c.notices||[]).forEach(x=>out.push({type:'noticeEvent',raw:x,c}))});return out.sort((a,b)=>timeOf(a.raw,a.c).localeCompare(timeOf(b.raw,b.c)))}
function counts(cycles){const sources=cycles.flatMap(c=>c.source_events||[]),methods=cycles.flatMap(c=>c.method_events||[]),notices=cycles.flatMap(c=>c.notices||[]);return{diff:sources.filter(x=>['discovered','changed','rejected'].includes(kindOf(x))).length,candidate:methods.filter(x=>kindOf(x)==='candidate').length,trial:methods.filter(x=>kindOf(x)==='trial').length,evolve:methods.filter(x=>['promoted','demoted'].includes(kindOf(x))).length,notice:notices.length}}
function renderHeader(){const c=D?.current||{},score=Math.max(0,Math.min(100,Number(c.intelligence_score)||0));$('#score').textContent=D?Math.round(score):'—';$('#scoreRing').style.setProperty('--score',score);$('#scoreRing').setAttribute('aria-label',`${tr('score')}: ${D?Math.round(score):tr('unknown')} / 100`);$('#scoreState').textContent=!D?tr('unknown'):score>=80?tr('excellent'):score>=45?tr('learning'):tr('starting');$('#generated').textContent=D?tr('generated',{s:formatTime(D.generated_at)}):tr('noGenerated');$('#strategy').textContent=c.strategy_version||D?.version||'—';const specs=[['watched','watched_sources'],['known','known_methods'],['promoted','promoted'],['demoted','demoted'],['pending','pending']];$('#summary').innerHTML=specs.map(([k,p])=>`<div class="metric"><b>${esc(D?(c[p]??0):'—')}</b><span>${esc(tr(k))}</span></div>`).join('')}
function renderPipeline(){const cycles=selectedCycles(),n=counts(cycles),watched=D?.current?.watched_sources??0;const stages=[['◉','watch',watched],['≠','diff',n.diff],['⌁','learn',n.candidate],['✓','verify',n.trial],['↗','evolve',n.evolve],['✦','notify',n.notice]];$('#pipeline').innerHTML=stages.map(([icon,k,v])=>`<div class="stage ${Number(v)>0?'active':''}"><span class="icon" aria-hidden="true">${icon}</span><b>${esc(tr(k).toUpperCase())}</b><small>${esc(tr(k+'Sub',{n:v}))}</small></div>`).join('')}
function renderCycles(){const bar=$('#cyclebar');if(!D||!D.cycles?.length){bar.innerHTML='';return}bar.innerHTML=`<span class="label">${esc(tr('cycles'))}</span><button class="cycle" type="button" data-cycle="-1" aria-pressed="${selected===-1}">${esc(tr('all'))}</button>`+D.cycles.map((c,i)=>`<button class="cycle" type="button" data-cycle="${i}" aria-pressed="${selected===i}">${esc(c.label?loc(c.label):formatTime(c.ts)||`C${i+1}`)}</button>`).join('')}
$('#cyclebar').addEventListener('click',e=>{const b=e.target.closest('[data-cycle]');if(!b)return;selected=Number(b.dataset.cycle);render()});
function detailOf(o){const bits=[];const source=value(o,'source');const ref=value(o,'ref','source_ref');const method=value(o,'method','method_key','key');const reason=value(o,'reason','reason_code');if(source)bits.push(`${tr('source')}: ${sourceName(source)}`);if(ref)bits.push(ref);if(method)bits.push(`${tr('method')}: ${methodName(method)}`);if(reason&&reason!==textOf(o))bits.push(`${tr('reason')}: ${label(String(reason))}`);return bits.join(' · ')}
function sourceName(s){const parts=String(s||'').split('|'),base=I[lang].sourceNames[parts[0]]||parts[0];return parts.length>1?`${base} · ${parts.slice(1).join(' · ')}`:base}
function methodName(key){const parts=String(key||'').split('|');if(parts.length!==3)return key||'—';return `${H[lang].device[parts[0]]||parts[0]} · ${H[lang].symptom[parts[1]]||parts[1]} · ${H[lang].action[parts[2]]||parts[2]}`}
function noticeSummary(n){const k=kindOf(n),method=methodName(value(n,'method','method_key'));if(k==='source_rejected')return lang==='zh'?'危险内容已拦截，不会影响处理规则。':'Unsafe content was blocked and cannot change handling rules.';if(k==='candidate_added')return lang==='zh'?`发现新方法：${method}`:`New method found: ${method}`;if(k==='candidate_changed')return lang==='zh'?`方法内容有更新，重新验证：${method}`:`Method changed and must be verified again: ${method}`;if(k==='method_promoted')return lang==='zh'?`验证通过，今后优先采用：${method}`:`Verified and now preferred: ${method}`;if(k==='method_demoted')return lang==='zh'?`效果变差，已经停用：${method}`:`Results regressed, so this method was paused: ${method}`;return textOf(n)||label(k)}
function renderStory(){if(!D){['storyFound','storyProved','storyImproved','storyAlert'].forEach(id=>$('#'+id).textContent='—');return}const cycles=D.cycles||[],methods=cycles.length?(cycles[cycles.length-1].methods||[]):[],proved=methods.filter(m=>Number(m.attempts)>0).length,notices=cycles.flatMap(c=>c.notices||[]).length,c=D.current||{};$('#storyFound').textContent=tr('storyFound',{n:c.known_methods||0});$('#storyProved').textContent=tr('storyProved',{n:proved});$('#storyImproved').textContent=tr('storyImproved',{p:c.promoted||0,d:c.demoted||0});$('#storyAlert').textContent=tr('storyAlert',{n:notices})}
function renderEvents(){const all=allEvents(selectedCycles()),list=all.slice(-10);$('#eventMeta').textContent=list.length===all.length?tr('eventsN',{n:all.length}):(lang==='zh'?`最近 ${list.length} / ${all.length} 条`:`Latest ${list.length} / ${all.length}`);$('#events').innerHTML=list.length?list.map(({type,raw,c})=>{const k=kindOf(raw),main=type==='noticeEvent'?noticeSummary(raw):(raw.reason?label(String(raw.reason)):(textOf(raw)||label(k))),detail=detailOf(raw);return `<article class="event ${esc(k)}"><time class="time">${esc(formatTime(timeOf(raw,c)))}</time><div class="kind">${esc(tr(type))} · ${esc(label(k))}</div><div><p>${esc(main)}</p>${detail?`<div class="sub">${esc(detail)}</div>`:''}</div></article>`}).join(''):empty(tr('noEvents'))}
function renderRadar(){const cycles=selectedCycles(),events=cycles.flatMap(c=>c.source_events||[]),names=['servicenow_kb','incident','chat','email','shared_drive'];$('#radar').innerHTML=names.map(name=>{const own=events.filter(e=>e.source===name),changed=own.filter(e=>['discovered','changed'].includes(kindOf(e))).length,rejected=own.filter(e=>kindOf(e)==='rejected').length,total=own.length;return `<div class="source ${rejected?'alert':''}"><div class="signal">${total}</div><b>${esc(sourceName(name))}</b><small>${esc(changed)} ${esc(tr('changed').toLowerCase())}${rejected?` · ${rejected} ${esc(tr('rejected').toLowerCase())}`:''}</small></div>`}).join('')}
function rateOf(m){const direct=Number(value(m,'success_rate','score','rate'));if(Number.isFinite(direct))return direct<=1?direct*100:direct;const success=Number(value(m,'successes','success')),attempts=Number(value(m,'attempts','trials'));return attempts?success/attempts*100:0}
function renderMethods(){const cycles=selectedCycles();let methods=[];cycles.forEach(c=>{if(c.methods?.length)methods=c.methods});$('#methods').innerHTML=methods.length?methods.map(m=>{const state=kindOf(m),rate=Math.max(0,Math.min(100,rateOf(m))),key=value(m,'method','key','id')||[m.device,m.symptom,m.action].filter(Boolean).join('|'),success=value(m,'successes','success'),attempts=value(m,'attempts','trials'),cls=state==='promoted'?'ok':state==='demoted'?'bad':state==='candidate'||state==='trial'?'warn':'mute';return `<article class="method"><div class="method-head"><span class="chip ${cls}">${esc(label(state))}</span><b>${esc(methodName(key))}</b></div><div class="meter" aria-label="${esc(tr('success',{n:Math.round(rate)}))}"><i style="width:${rate}%"></i></div><p>${esc(tr('success',{n:Math.round(rate)}))}${attempts!==''?` · ${esc(tr('attempts',{s:success||0,a:attempts||0}))}`:''}</p></article>`}).join(''):empty(tr('noMethods'))}
function versions(){return selectedCycles().flatMap(c=>c.versions||[]).sort((a,b)=>timeOf(b).localeCompare(timeOf(a)))}
function objectState(v){if(v==null)return'';if(typeof v!=='object')return label(String(v));const state=value(v,'state','status');if(state)return label(String(state));const score=value(v,'success_rate','score');return score!==''?String(score):''}
function renderVersions(){const list=versions();$('#versions').innerHTML=list.length?list.map(v=>{const before=objectState(v.before),after=objectState(v.after),change=before||after?tr('fromTo',{a:before||'—',b:after||'—'}):'';return `<article class="record"><div><div class="version">${esc(v.version||'—')}</div><div class="sub">${esc(formatTime(v.created_at||v.ts))}</div></div><div><p>${esc(value(v,'method','method_key')?methodName(value(v,'method','method_key')):label(v.reason||'source_change'))}</p><div class="sub">${esc(label(v.reason||'source_change'))}</div></div><div class="change">${esc(change)}</div></article>`}).join(''):empty(tr('noVersions'))}
function renderNotices(){const list=selectedCycles().flatMap(c=>(c.notices||[]).map(n=>({n,c}))).reverse();$('#notices').innerHTML=list.length?list.map(({n,c})=>{const k=kindOf(n),method=value(n,'method','method_key'),source=value(n,'source'),old=value(n,'old_state','before'),next=value(n,'new_state','after'),effect=loc(value(n,'policy_effect','effect'),n);const details=[];if(source)details.push(`${tr('source')}: ${sourceName(source)}`);if(method)details.push(`${tr('method')}: ${methodName(method)}`);if(old||next)details.push(tr('fromTo',{a:objectState(old)||'—',b:objectState(next)||'—'}));if(effect)details.push(`${tr('policy')}: ${effect}`);const tone=k.includes('demoted')||k.includes('rejected')?'bad':k.includes('promoted')?'ok':'warn';return `<article class="notice"><div class="notice-head"><span class="chip info">${esc(tr('dryNotice'))}</span><span class="chip ${tone}">${esc(label(k))}</span><time>${esc(formatTime(timeOf(n,c)))}</time></div><p>${esc(noticeSummary(n))}</p>${details.length?`<div class="sub">${esc(details.join(' · '))}</div>`:''}</article>`}).join(''):empty(tr('noNotices'))}
function render(){renderHeader();renderPipeline();renderStory();renderCycles();if(!D){$('#dashboard').innerHTML=`<section class="card wide global-empty">${empty(tr('noGenerated'),tr('noGeneratedHelp'))}</section>`;return}renderEvents();renderRadar();renderMethods();renderVersions();renderNotices()}
setLanguage(lang);
})();
</script>
</body>
</html>
